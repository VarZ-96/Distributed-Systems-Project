services:
  postgres:
    image: postgres:16-alpine
    container_name: oauth-rbac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oauth_rbac_demo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oauth_rbac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oauth_rbac_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  oauth_rbac_pgdata:
    name: oauth_rbac_pgdata
